<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryTutor-MM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Noto Sans Devanagari is load-bearing: without it Hindi and Marathi render as tofu boxes. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
<style>
:root{
  --bg:#0b0fial;--bg:#0b0f17;--panel:#121822;--panel2:#1a2230;--line:#243044;
  --txt:#e6edf6;--dim:#8fa3bd;--accent:#4f9cf9;--accent2:#22c55e;
  --warn:#f59e0b;--danger:#ef4444;--violet:#a78bfa;
  --radius:14px;
}
:root[data-theme="light"]{
  --bg:#f6f8fb;--panel:#ffffff;--panel2:#f0f4f9;--line:#dbe3ee;
  --txt:#0f172a;--dim:#5b6b82;--accent:#2563eb;--accent2:#16a34a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Inter','Noto Sans Devanagari',system-ui,sans-serif;
  height:100vh;overflow:hidden;
}
.deva{font-family:'Noto Sans Devanagari','Inter',sans-serif;line-height:1.85}
#root{height:100vh}
.app{display:flex;flex-direction:column;height:100vh}

/* ---- header ---- */
.hdr{
  display:flex;align-items:center;gap:14px;padding:12px 20px;
  border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0;
}
.logo{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--violet));
  display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;
}
.hdr h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
.hdr .sub{font-size:11.5px;color:var(--dim)}
.spacer{flex:1}
.pill{
  font-size:11px;padding:4px 10px;border-radius:999px;font-weight:600;
  border:1px solid var(--line);background:var(--panel2);color:var(--dim);
  white-space:nowrap;
}
.pill.ok{color:var(--accent2);border-color:color-mix(in srgb,var(--accent2) 40%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.iconbtn{
  background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px;
}
.iconbtn:hover{color:var(--txt)}

/* ---- layout ---- */
.main{display:flex;flex:1;min-height:0}
.chatcol{flex:1;display:flex;flex-direction:column;min-width:0}
.side{
  width:340px;border-left:1px solid var(--line);background:var(--panel);
  overflow-y:auto;flex-shrink:0;padding:16px;
}
@media(max-width:1000px){.side{display:none}}

.stream{flex:1;overflow-y:auto;padding:24px 20px;scroll-behavior:smooth}
.inner{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* ---- welcome ---- */
.welcome{text-align:center;padding:44px 16px}
.welcome h2{font-size:26px;font-weight:700;margin-bottom:8px;letter-spacing:-.02em}
.welcome p{color:var(--dim);font-size:14px;max-width:520px;margin:0 auto 26px}
.examples{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;max-width:700px;margin:0 auto}
.ex{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 15px;text-align:left;cursor:pointer;transition:.15s;
}
.ex:hover{border-color:var(--accent);transform:translateY(-2px)}
.ex .lang{font-size:10px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.ex .q{font-size:13px;margin-top:5px;line-height:1.55}

/* ---- messages ---- */
.msg{display:flex;gap:12px}
.av{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;
  font-size:12px;font-weight:700;
}
.av.u{background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.av.a{background:linear-gradient(135deg,var(--accent),var(--violet));color:#fff}
.body{flex:1;min-width:0}
.who{font-size:11.5px;color:var(--dim);font-weight:600;margin-bottom:6px}
.bubble{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 17px;font-size:14.5px;line-height:1.72;white-space:pre-wrap;word-wrap:break-word;
}
.msg.user .bubble{background:var(--panel2)}

.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}

/* ---- tabs ---- */
.tabs{display:flex;gap:3px;margin:13px 0 9px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{
  background:none;border:none;color:var(--dim);font-size:12.5px;font-weight:600;
  padding:7px 12px;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;
}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--txt)}

/* ---- sources ---- */
.src{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;margin-bottom:8px;font-size:12.5px;
}
.src-h{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.tag{
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;
  background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
}
.tag.g{background:color-mix(in srgb,var(--accent2) 16%,transparent);color:var(--accent2)}
.src-m{color:var(--dim);font-size:11.5px;line-height:1.6}
.scores{display:flex;gap:12px;margin-top:6px;font-size:10.5px;color:var(--dim);flex-wrap:wrap}
.scores b{color:var(--txt);font-weight:600}

/* ---- quiz ---- */
.qz{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qz .qq{font-weight:600;font-size:13.5px;margin-bottom:9px;line-height:1.6}
.opt{
  padding:8px 11px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px;
  cursor:pointer;font-size:12.5px;transition:.12s;line-height:1.55;
}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 12%,transparent)}
.opt.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.qz .exp{font-size:12px;color:var(--dim);margin-top:9px;padding-top:9px;border-top:1px solid var(--line);line-height:1.65}

/* ---- composer ---- */
.composer{border-top:1px solid var(--line);background:var(--panel);padding:14px 20px;flex-shrink:0}
.cwrap{max-width:780px;margin:0 auto}
.ctrls{display:flex;gap:7px;margin-bottom:9px;flex-wrap:wrap}
select{
  background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:7px;padding:6px 9px;font-size:12px;font-family:inherit;cursor:pointer;
}
.inrow{display:flex;gap:9px;align-items:flex-end}
textarea{
  flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;
  resize:none;min-height:46px;max-height:150px;line-height:1.55;
}
textarea:focus{outline:none;border-color:var(--accent)}
.send{
  background:var(--accent);border:none;color:#fff;border-radius:10px;
  padding:0 20px;height:46px;font-weight:600;cursor:pointer;font-size:14px;font-family:inherit;
}
.send:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:11px;color:var(--dim);margin-top:7px;text-align:center}

/* ---- side panel ---- */
.side h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin-bottom:11px}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.stat span:first-child{color:var(--dim)}
.stat span:last-child{font-weight:600;text-align:right;word-break:break-all}
.pipe{margin-top:22px}
.stage{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:12.5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex-shrink:0}
.dot.on{background:var(--accent2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent2) 20%,transparent)}
.stage .nm{flex:1}
.stage .vl{color:var(--dim);font-size:11px}

.cite{color:var(--accent);font-weight:600;cursor:pointer;font-size:.92em;padding:0 1px}
.cite:hover{text-decoration:underline}
.excerpt{margin-top:7px;padding:8px 10px;background:var(--bg);border-radius:7px;
  font-size:11.5px;color:var(--dim);line-height:1.65;border-left:2px solid var(--line)}
.srcbtn{margin-top:9px;background:none;border:1px solid var(--line);color:var(--dim);
  border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600}
.srcbtn:hover{color:var(--txt);border-color:var(--accent)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.stream::-webkit-scrollbar,.side::-webkit-scrollbar{width:8px}
.stream::-webkit-scrollbar-thumb,.side::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useRef,useEffect} = React;

const EXAMPLES = [
  {lang:'english', q:'Explain how energy transfers when a spoon warms in hot water', cls:'6', sub:'science'},
  {lang:'hindi',   q:'पादपों में भोजन कैसे बनता है?', cls:'7', sub:'science'},
  {lang:'marathi', q:'भारतातील ब्रिटीश वसाहतवादाचा देशावर कसा परिणाम झाला?', cls:'8', sub:'social_science'},
  {lang:'english', q:'What are oceans and continents, and how are they distributed?', cls:'6', sub:'social_science'},
];

const isDeva = s => /[ऀ-ॿ]/.test(s||'');

function Badge({kind,children}){ return <span className={'pill '+(kind||'')}>{children}</span> }

function Sources({list}){
  if(!list || !list.length) return <p style={{color:'var(--dim)',fontSize:13}}>No sources matched.</p>;
  return list.map((s,i)=>(
    <div className="src" key={i}>
      <div className="src-h">
        <span className="tag">{s.marker||('S'+(i+1))}</span>
        {s.rerank_score!=null && <span className="tag g">reranked</span>}
        <span className="src-m">
          {[s.class_level&&'Class '+s.class_level, s.subject, s.language].filter(Boolean).join(' · ')}
        </span>
      </div>
      <div className="src-m">
        {s.source_file||s.id||'curated source'}
        {s.chapter?' · ch '+s.chapter:''}{s.page?' · p'+s.page:''}
      </div>
      {s.excerpt && <div className={'excerpt '+(isDeva(s.excerpt)?'deva':'')}>{s.excerpt}</div>}
      <div className="scores">
        {s.score!=null && <span>score <b>{Number(s.score).toFixed(3)}</b></span>}
        {s.rerank_score!=null && <span>rerank <b>{Number(s.rerank_score).toFixed(3)}</b></span>}
      </div>
    </div>
  ));
}

function Answer({d}){
  const [showSrc,setShowSrc] = useState(false);
  const srcs = d.sources||[];
  const provider = d.model_provider||'unknown';
  const live = !['none','passages_only','unknown'].includes(provider);
  const method = d.retrieval_method||'—';

  // Turn [S1] markers into clickable chips so a claim links to its source.
  const parts = String(d.answer||'').split(/(\[S\d+\])/g);

  return (
    <div>
      <div className="badges">
        {d.grounded===false && <Badge kind="warn">no matching sources</Badge>}
        <Badge kind={live?'ok':'warn'}>{live?provider:(provider==='passages_only'?'passages only (no LLM)':provider)}</Badge>
        {method!=='—' && <Badge kind={method.includes('rerank')?'ok':''}>{method}</Badge>}
        <Badge>{srcs.length} source{srcs.length===1?'':'s'}</Badge>
      </div>

      <div className={'bubble '+(isDeva(d.answer)?'deva':'')}>
        {parts.map((p,i)=> /^\[S\d+\]$/.test(p)
          ? <span key={i} className="cite" onClick={()=>setShowSrc(true)}>{p}</span>
          : <span key={i}>{p}</span>)}
      </div>

      {srcs.length>0 && (
        <>
          <button className="srcbtn" onClick={()=>setShowSrc(!showSrc)}>
            {showSrc?'Hide':'Show'} {srcs.length} source{srcs.length===1?'':'s'}
          </button>
          {showSrc && <div style={{marginTop:10}}><Sources list={srcs}/></div>}
        </>
      )}
    </div>
  );
}

function App(){
  const [msgs,setMsgs] = useState([]);
  const [q,setQ] = useState('');
  const [busy,setBusy] = useState(false);
  const [health,setHealth] = useState(null);
  const [lang,setLang] = useState('english');
  const [cls,setCls] = useState('6');
  const [sub,setSub] = useState('science');
  const [theme,setTheme] = useState('dark');
  const end = useRef(null);

  useEffect(()=>{fetch('/api/health').then(r=>r.json()).then(setHealth).catch(()=>setHealth({status:'offline'}))},[]);
  useEffect(()=>{end.current?.scrollIntoView({behavior:'smooth'})},[msgs,busy]);
  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme)},[theme]);

  const ask = async (text,o={})=>{
    const question=(text||q).trim(); if(!question||busy) return;
    const L=o.lang||lang, C=o.cls||cls, S=o.sub||sub;
    setMsgs(m=>[...m,{role:'user',text:question,lang:L}]); setQ(''); setBusy(true);
    try{
      const r = await fetch('/api/chat',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({question,language:L,class_level:C,subject:S})
      });
      const d = await r.json();
      setMsgs(m=>[...m,{role:'assistant',data:d}]);
    }catch(e){
      setMsgs(m=>[...m,{role:'assistant',error:String(e)}]);
    }finally{ setBusy(false) }
  };

  const last = [...msgs].reverse().find(m=>m.role==='assistant' && m.data)?.data;
  const lastSrc = (last?.sources||[])[0];
  const method = last?.retrieval_method||'';

  return (
    <div className="app">
      <div className="hdr">
        <div className="logo">ST</div>
        <div>
          <h1>StoryTutor-MM</h1>
          <div className="sub">Curriculum RAG · NCERT Class 6–8 · EN / हिंदी / मराठी</div>
        </div>
        <div className="spacer"></div>
        {health && <Badge kind={health.status==='online'?'ok':'bad'}>{health.status==='online'?'online':'offline'}</Badge>}
        {health?.model_provider && <Badge kind={['deterministic','none'].includes(health.model_provider)?'warn':'ok'}>{health.model_provider}</Badge>}
        <button className="iconbtn" onClick={()=>setTheme(theme==='dark'?'light':'dark')}>{theme==='dark'?'☀':'☾'}</button>
      </div>

      <div className="main">
        <div className="chatcol">
          <div className="stream">
            <div className="inner">
              {!msgs.length && (
                <div className="welcome">
                  <h2>Ask your textbook anything</h2>
                  <p>Every answer is retrieved from real NCERT pages and cited. Pick a language — the system searches that language's books.</p>
                  <div className="examples">
                    {EXAMPLES.map((e,i)=>(
                      <div className="ex" key={i} onClick={()=>{setLang(e.lang);setCls(e.cls);setSub(e.sub);ask(e.q,{lang:e.lang,cls:e.cls,sub:e.sub})}}>
                        <div className="lang">{e.lang}</div>
                        <div className={'q '+(isDeva(e.q)?'deva':'')}>{e.q}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {msgs.map((m,i)=>(
                <div className={'msg '+m.role} key={i}>
                  <div className={'av '+(m.role==='user'?'u':'a')}>{m.role==='user'?'You':'ST'}</div>
                  <div className="body">
                    <div className="who">{m.role==='user'?'You':'StoryTutor'}</div>
                    {m.role==='user'
                      ? <div className={'bubble '+(isDeva(m.text)?'deva':'')}>{m.text}</div>
                      : m.error
                        ? <div className="bubble" style={{color:'var(--danger)'}}>Request failed: {m.error}</div>
                        : <Answer d={m.data}/>}
                  </div>
                </div>
              ))}

              {busy && (
                <div className="msg">
                  <div className="av a">ST</div>
                  <div className="body">
                    <div className="who">StoryTutor</div>
                    <div className="bubble" style={{color:'var(--dim)'}}>
                      <span className="spin"></span>&nbsp;&nbsp;Retrieving from NCERT sources…
                    </div>
                  </div>
                </div>
              )}
              <div ref={end}></div>
            </div>
          </div>

          <div className="composer">
            <div className="cwrap">
              <div className="ctrls">
                <select value={lang} onChange={e=>setLang(e.target.value)}>
                  <option value="english">English</option>
                  <option value="hindi">हिंदी</option>
                  <option value="marathi">मराठी</option>
                </select>
                <select value={cls} onChange={e=>setCls(e.target.value)}>
                  <option value="6">Class 6</option><option value="7">Class 7</option><option value="8">Class 8</option>
                </select>
                <select value={sub} onChange={e=>setSub(e.target.value)}>
                  <option value="science">Science</option>
                  <option value="social_science">Social Science</option>
                </select>
              </div>
              <div className="inrow">
                <textarea value={q} onChange={e=>setQ(e.target.value)} placeholder="Ask a question from your textbook…"
                  onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}}}
                  className={isDeva(q)?'deva':''}/>
                <button className="send" onClick={()=>ask()} disabled={busy||!q.trim()}>Ask</button>
              </div>
              <div className="hint">Enter to send · Shift+Enter for a new line</div>
            </div>
          </div>
        </div>

        <div className="side">
          <h3>System</h3>
          <div className="stat"><span>Engine</span><span>{health?.engine||'—'}</span></div>
          <div className="stat"><span>Embeddings</span><span>{health?.embedding_model||'—'}</span></div>
          <div className="stat"><span>Generator</span><span>{health?.model_provider||'—'}</span></div>

          <div className="pipe">
            <h3>Retrieval pipeline</h3>
            <div className="stage"><span className={'dot'+(method?' on':'')}></span><span className="nm">Dense (bge-m3 + FAISS)</span></div>
            <div className="stage"><span className={'dot'+(method?' on':'')}></span><span className="nm">Sparse (BM25)</span></div>
            <div className="stage"><span className={'dot'+(method.includes('rrf')?' on':'')}></span><span className="nm">RRF fusion</span></div>
            <div className="stage"><span className={'dot'+(method.includes('rerank')?' on':'')}></span><span className="nm">Cross-encoder rerank</span>
              <span className="vl">{method.includes('rerank')?'on':'off'}</span></div>
            <div className="stage"><span className={'dot'+(last&&!['none','passages_only'].includes(last.model_provider)?' on':'')}></span>
              <span className="nm">LLM generation</span>
              <span className="vl">{last?.model_provider||'—'}</span></div>
          </div>

          {last && (
            <div className="pipe">
              <h3>Last query</h3>
              <div className="stat"><span>Sources</span><span>{(last.sources||[]).length}</span></div>
              <div className="stat"><span>Method</span><span>{method||'—'}</span></div>
              {lastSrc?.score!=null &&
                <div className="stat"><span>Top score</span><span>{Number(lastSrc.score).toFixed(3)}</span></div>}
              <div className="stat"><span>Grounded</span><span>{last.grounded?'yes':'no'}</span></div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
