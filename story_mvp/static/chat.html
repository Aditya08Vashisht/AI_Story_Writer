<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryTutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Tiro Devanagari (Hindi and Marathi cuts) sets answers like a printed
     textbook in all three languages; Hind covers Latin + Devanagari for the
     interface. Without a Devanagari font, Hindi and Marathi render as boxes. -->
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Tiro+Devanagari+Hindi:ital@0;1&family=Tiro+Devanagari+Marathi:ital@0;1&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
<style>
/* ---- tokens: paper & ink by day, blackboard & chalk by night ---- */
:root{
  --paper:#f3eee3; --sheet:#fbf8f1; --ink:#211f1a; --ink-2:#4a463d; --muted:#766f61;
  --rule:#ddd3bf; --rule-2:#e9e1cf; --blue:#1f4e8c; --blue-ink:#ffffff;
  --marigold:#f1c24f; --marigold-soft:#f7e2a6; --stamp:#a8392a; --ok:#2f6b3f;
  --shadow:0 1px 0 rgba(33,31,26,.04);
  --serif:'Tiro Devanagari Hindi',Georgia,serif;
  --serif-mr:'Tiro Devanagari Marathi','Tiro Devanagari Hindi',Georgia,serif;
  --sans:'Hind',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#18221e; --sheet:#1e2a25; --ink:#ebe5d4; --ink-2:#cfc8b6; --muted:#9ca496;
    --rule:#33443c; --rule-2:#2a3832; --blue:#9fc0ec; --blue-ink:#10201b;
    --marigold:#e0b24c; --marigold-soft:#4a3f22; --stamp:#e2826f; --ok:#8cc79a;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#18221e; --sheet:#1e2a25; --ink:#ebe5d4; --ink-2:#cfc8b6; --muted:#9ca496;
  --rule:#33443c; --rule-2:#2a3832; --blue:#9fc0ec; --blue-ink:#10201b;
  --marigold:#e0b24c; --marigold-soft:#4a3f22; --stamp:#e2826f; --ok:#8cc79a;
  --shadow:none; color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
#root{height:100%}

/* ---- frame ---- */
/* One row, exactly the viewport: the row used to grow with the rail, which
   pushed the composer off-screen whenever the rail was taller than the window. */
.frame{display:grid;grid-template-columns:clamp(210px,19vw,268px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);
  height:100vh;height:100dvh;overflow:hidden}
@media (max-width:960px){.frame{grid-template-columns:minmax(0,1fr)}}

/* ---- left rail: the book you are asking ---- */
.rail{border-right:1px solid var(--rule);background:var(--sheet);padding:clamp(16px,3vh,26px) clamp(14px,1.6vw,22px);
  display:flex;flex-direction:column;gap:clamp(12px,2.6vh,26px);overflow-y:auto;min-height:0}
@media (max-width:960px){.rail{display:none}}
.brand{display:flex;gap:11px;align-items:center}
.brand svg{flex:none;color:var(--ink)}
.brand b{font-family:var(--serif);font-weight:400;font-size:clamp(20px,1.2rem + .4vw,25px);letter-spacing:-.01em;line-height:1}
.brand small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.group h4{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.langs{display:flex;flex-direction:column;gap:2px}
.langs button{display:flex;justify-content:space-between;align-items:baseline;text-align:left;
  padding:clamp(5px,1vh,8px) 10px;border-radius:6px;font-size:clamp(14.5px,.85rem + .15vw,16px);color:var(--ink-2)}
.langs button small{font-size:12px;color:var(--muted)}
.langs button:hover{background:var(--rule-2)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.langs button[aria-pressed="true"] small{color:inherit;opacity:.7}
.classes{display:flex;gap:6px}
.classes button{width:clamp(36px,5.2vh,46px);height:clamp(36px,5.2vh,46px);border-radius:50%;border:1px solid var(--rule);
  font-family:var(--serif);font-size:clamp(16px,2.2vh,20px);color:var(--ink-2)}
.classes button:hover{border-color:var(--ink-2)}
.classes button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.subjects{display:flex;flex-direction:column;gap:2px}
.subjects button{text-align:left;padding:clamp(5px,.9vh,7px) 10px;border-radius:6px;color:var(--ink-2);border-left:3px solid transparent}
.subjects button:hover{background:var(--rule-2)}
.subjects button[aria-pressed="true"]{border-left-color:var(--marigold);color:var(--ink);font-weight:600;background:var(--rule-2)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--rule);padding-top:clamp(8px,1.6vh,16px)}
.rail-link{display:flex;align-items:center;gap:9px;padding:clamp(4px,.8vh,7px) 4px;color:var(--ink-2);text-decoration:none;font-size:15px;border-radius:6px}
.rail-link:hover{color:var(--ink)}
.status{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:center;padding:6px 4px 0}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.on i{background:var(--ok)}

@media (max-height:640px) and (min-width:961px){
  .group h4{margin-bottom:5px}
  .brand small{display:none}
  .status{display:none}
}

/* ---- mobile top bar ---- */
.topbar{display:none}
@media (max-width:960px){
  .topbar{display:flex;flex-direction:column;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--rule);background:var(--sheet)}
  .topbar .row{display:flex;align-items:center;gap:10px}
  .topbar .brand b{font-size:21px}
  .topbar .row.pickers{gap:8px;overflow-x:auto}
  .topbar select{font:inherit;font-size:14px;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:6px 8px}
  .topbar .spacer{flex:1}
}

/* ---- the page ---- */
.page{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto}
.composer{flex:none}
.column{max-width:min(760px,100%);margin:0 auto;padding:clamp(20px,4vh,40px) clamp(16px,3vw,32px) 28px}
@media (max-width:600px){.column{padding:24px 16px}}

.intro h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,1.4rem + 2.2vw,44px);line-height:1.1;letter-spacing:-.015em}
.intro p{font-size:clamp(15.5px,.9rem + .25vw,17px);color:var(--ink-2);max-width:560px;margin-top:12px}
.intro .try{margin-top:clamp(18px,4vh,34px);font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.intro ol{list-style:none;margin-top:8px;border-top:1px solid var(--rule)}
.intro li button{display:flex;gap:14px;width:100%;text-align:left;padding:clamp(9px,1.6vh,14px) 2px;border-bottom:1px solid var(--rule)}
.intro li button:hover .q{text-decoration:underline;text-decoration-color:var(--marigold);text-decoration-thickness:2px;text-underline-offset:4px}
.intro .n{font-family:var(--serif);color:var(--muted);font-size:18px;width:20px;flex:none}
.intro .q{font-family:var(--serif);font-size:clamp(16.5px,.95rem + .35vw,19px);line-height:1.45}
.intro .q:lang(mr){font-family:var(--serif-mr)}
.intro .where{display:block;font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-top:3px}

/* ---- question & answer, set like a textbook exercise ---- */
.qa{padding:clamp(18px,3.4vh,26px) 0;border-bottom:1px solid var(--rule)}
.qa:first-child{padding-top:0}
.label{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.question{font-family:var(--serif);font-size:clamp(19px,1.05rem + .55vw,23px);line-height:1.4}
.question:lang(mr){font-family:var(--serif-mr)}
.context{font-size:13px;color:var(--muted);margin-top:4px}
.answer{margin-top:clamp(12px,2vh,18px)}
.prose{font-family:var(--serif);font-size:clamp(16.5px,.95rem + .3vw,19px);line-height:1.72;white-space:pre-wrap;word-wrap:break-word}
.prose:lang(mr){font-family:var(--serif-mr)}
.prose:lang(hi),.prose:lang(mr){line-height:1.9}
sup.fn{font-family:var(--sans);font-size:.62em;font-weight:600;line-height:0;vertical-align:super;
  padding:0 .28em;margin:0 .06em;border-radius:3px;background:var(--marigold-soft);color:var(--ink);cursor:pointer}
sup.fn:hover{background:var(--marigold)}
.caret{display:inline-block;width:.5em;height:1em;background:var(--ink);vertical-align:-.12em;margin-left:2px;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.note{margin-top:4px;padding:2px 0 2px 14px;border-left:3px solid var(--rule);color:var(--ink-2);font-size:15px}
.error{border-left-color:var(--stamp);color:var(--stamp)}

.searching{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:15px;margin-top:18px}
.searching .line{width:56px;height:2px;background:var(--rule);position:relative;overflow:hidden}
.searching .line::after{content:'';position:absolute;inset:0;width:40%;background:var(--ink-2);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

/* ---- footnotes: where every fact came from ---- */
.footnotes{margin-top:18px;padding-top:12px;border-top:1px solid var(--rule-2);font-size:14px}
.footnotes .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--muted);font-size:12.5px;margin-bottom:6px}
@media (max-width:600px){.footnotes .hd span+span{display:none}}
.fnrow{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:5px 0;align-items:start}
.fnrow .num{font-weight:600;color:var(--ink-2)}
.fnrow.cited .num{background:var(--marigold-soft);border-radius:3px;text-align:center}
.fnrow .src{color:var(--ink-2)}
.fnrow .src button{text-align:left;color:inherit}
.fnrow .src button:hover{text-decoration:underline}
.fnrow .ex{margin-top:6px;padding:8px 12px;background:var(--sheet);border:1px solid var(--rule-2);border-radius:6px;
  font-family:var(--serif);font-size:15.5px;line-height:1.7;color:var(--ink-2)}
.fnrow .ex:lang(mr){font-family:var(--serif-mr)}
.fnrow.flash .src{background:var(--marigold-soft);border-radius:4px}

/* ---- actions ---- */
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.act{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--rule);border-radius:6px;
  font-size:14.5px;color:var(--ink-2);background:var(--sheet)}
.act:hover{border-color:var(--ink-2);color:var(--ink)}
.act[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.act:disabled{opacity:.5;cursor:default}

details.how{margin-top:12px;font-size:13px;color:var(--muted)}
details.how summary{cursor:pointer;width:max-content}
details.how summary:hover{color:var(--ink-2)}
details.how dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin-top:8px;font-variant-numeric:tabular-nums}
details.how dt{color:var(--muted)} details.how dd{color:var(--ink-2)}

/* ---- video from an answer ---- */
.making{margin-top:16px;padding:14px 16px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
.making .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px}
.making .clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px}
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.steps li{font-size:13px;color:var(--muted);border-top:3px solid var(--rule);padding-top:6px}
.steps li.done{border-top-color:var(--ink-2);color:var(--ink-2)}
.steps li.now{border-top-color:var(--marigold);color:var(--ink);font-weight:600}
@media (max-width:600px){.steps{grid-template-columns:repeat(2,1fr)}}
.making .detail{margin-top:10px;font-size:13px;color:var(--muted)}

figure.film{margin-top:18px}
figure.film video{width:100%;display:block;border-radius:6px;background:#000;aspect-ratio:16/9}
figure.film figcaption{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-top:8px;font-size:14px;color:var(--ink-2)}
figure.film figcaption b{font-family:var(--serif);font-weight:400;font-size:16px;color:var(--ink)}
.stamp{flex:none;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--stamp);
  border:1.5px solid var(--stamp);border-radius:4px;padding:3px 7px;transform:rotate(-2deg)}

/* ---- composer ---- */
.composer{border-top:1px solid var(--rule);background:var(--sheet)}
.composer .inner{max-width:min(760px,100%);margin:0 auto;padding:clamp(8px,1.6vh,14px) clamp(16px,3vw,32px) clamp(10px,1.8vh,16px)}
.asking{font-size:13px;color:var(--muted);margin-bottom:clamp(5px,1vh,8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asking b{color:var(--ink-2);font-weight:600}
.field{display:flex;gap:10px;align-items:flex-end}
.field textarea{flex:1;min-width:0;resize:none;height:clamp(44px,6.4vh,50px);min-height:44px;max-height:30vh;padding:clamp(9px,1.4vh,12px) 14px;border:1px solid var(--rule);border-radius:8px;
  background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:clamp(16px,.9rem + .25vw,18px);line-height:1.45}
.field textarea::placeholder{color:var(--muted)}
.field textarea:focus{outline:none;border-color:var(--ink-2)}
.ask{flex:none;height:clamp(44px,6.4vh,50px);padding:0 clamp(16px,1.6vw,22px);border-radius:8px;background:var(--blue);color:var(--blue-ink);font-weight:600;font-size:16px}
.ask:disabled{opacity:.45;cursor:default}
.toggle{display:flex;align-items:center;gap:9px;padding:7px 4px;font-size:15px;color:var(--ink-2)}
.toggle .sw{width:30px;height:17px;border-radius:9px;background:var(--rule);position:relative;flex:none;transition:background .15s}
.toggle .sw::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--sheet);transition:transform .15s}
.toggle[aria-pressed="true"] .sw{background:var(--ink-2)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(13px)}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:var(--rule);border-radius:5px}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useRef,useEffect} = React;

const LANGS = [
  {id:'english', name:'English', native:'English', code:'en'},
  {id:'hindi',   name:'Hindi',   native:'हिंदी',   code:'hi'},
  {id:'marathi', name:'Marathi', native:'मराठी',   code:'mr'},
];
const LANG = Object.fromEntries(LANGS.map(l=>[l.id,l]));
const SUBJECTS = [{id:'science',name:'Science'},{id:'social_science',name:'Social Science'}];
const subjectName = s => (SUBJECTS.find(x=>x.id===s)||{name:s||''}).name;

const EXAMPLES = [
  {lang:'english', cls:'7', sub:'science',        q:'Why does a metal spoon get hot in hot water?'},
  {lang:'hindi',   cls:'7', sub:'science',        q:'पौधे अपना भोजन कैसे बनाते हैं?'},
  {lang:'marathi', cls:'8', sub:'social_science', q:'भारतातील ब्रिटीश वसाहतवादाचा देशावर कसा परिणाम झाला?'},
  {lang:'english', cls:'6', sub:'social_science', q:'If it is noon at the Prime Meridian, why is it 5:30 pm in India?'},
];

const isDeva = s => /[ऀ-ॿ]/.test(s||'');
// Text language for fonts and screen readers: the script decides, then the chosen language.
const langAttr = (text, lang) => isDeva(text) ? (lang==='marathi'?'mr':'hi') : 'en';

// NCERT file codes end in the chapter number: gecu104 -> 4, hmres104 -> 4, ghcu110 -> 10.
function chapterLabel(ch){
  const m = String(ch||'').match(/^[a-z]+\d(\d\d)$/i);
  return m ? 'Ch. '+parseInt(m[1],10) : (ch ? 'Ch. '+ch : '');
}
function sourceLabel(s){
  return ['Class '+(s.class_level||'–'), subjectName(s.subject), chapterLabel(s.chapter), s.page?('p. '+s.page):'']
    .filter(Boolean).join(' · ');
}

/* ---- icons: plain strokes, no emoji ---- */
function Icon({name,size=17}){
  const p = {width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:1.7,
             strokeLinecap:'round',strokeLinejoin:'round','aria-hidden':true};
  if(name==='book') return <svg {...p}><path d="M3 5.5C5.5 4 8.5 4 12 6c3.5-2 6.5-2 9-.5V19c-2.5-1.5-5.5-1.5-9 .5-3.5-2-6.5-2-9-.5z"/><path d="M12 6v13.5"/></svg>;
  if(name==='speaker') return <svg {...p}><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>;
  if(name==='stop') return <svg {...p}><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg>;
  if(name==='film') return <svg {...p}><rect x="3.5" y="5" width="17" height="14" rx="1.5"/><path d="M3.5 9h17M3.5 15h17M8 5v14M16 5v14"/></svg>;
  if(name==='notes') return <svg {...p}><path d="M5 5h14M5 10h14M5 15h9"/></svg>;
  if(name==='library') return <svg {...p}><rect x="4" y="4" width="4" height="16" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><path d="M16.5 5.5l3.5 14"/></svg>;
  if(name==='sun') return <svg {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>;
  if(name==='moon') return <svg {...p}><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>;
  return null;
}

/* ---- read aloud ----
   Sentence by sentence through /api/tts (Indic Parler-TTS on the server), so
   speech starts after the first sentence instead of the whole answer; the
   next sentence is fetched while the current one plays. If the voice server
   is down, the browser's own voice reads it instead. */
const SPEECH_LANG = {english:'en-IN', hindi:'hi-IN', marathi:'mr-IN'};
const PLAYER = {token:0, audio:null};

function speechPieces(text){
  const clean = String(text||'')
    .replace(/\[S\d+\]/g,'').replace(/https?:\/\/\S+/g,'')
    .replace(/(\*\*|__|`|^#+\s*|^\s*[-*•]\s+)/gm,'').replace(/\s+/g,' ').trim();
  const out = [];
  for(const s of clean.split(/(?<=[.!?।॥])\s+/)){
    if(!s.trim()) continue;
    if(out.length && s.length < 25) out[out.length-1] += ' ' + s; else out.push(s.trim());
  }
  return out;
}

function stopSpeaking(){
  PLAYER.token++;
  if(PLAYER.audio){ PLAYER.audio.pause(); PLAYER.audio = null; }
  if(window.speechSynthesis) window.speechSynthesis.cancel();
}

async function speak(text, lang, onState){
  stopSpeaking();
  const token = PLAYER.token;
  const pieces = speechPieces(text);
  if(!pieces.length) return;
  const fetchClip = s => fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:s,language:lang})})
    .then(r=>{ if(!r.ok) throw new Error('tts '+r.status); return r.blob(); });

  onState('loading');
  try{
    let next = fetchClip(pieces[0]);
    for(let i=0;i<pieces.length;i++){
      const blob = await next;
      if(token!==PLAYER.token) return;
      if(i+1<pieces.length) next = fetchClip(pieces[i+1]);
      const url = URL.createObjectURL(blob);
      const a = new Audio(url); PLAYER.audio = a;
      onState('playing');
      await new Promise((res,rej)=>{ a.onended=res; a.onerror=rej; a.play().catch(rej); });
      URL.revokeObjectURL(url);
      if(token!==PLAYER.token) return;
    }
  }catch(e){
    if(token!==PLAYER.token) return;
    // Voice server unavailable: the browser's voice is better than silence.
    if(window.speechSynthesis){
      const u = new SpeechSynthesisUtterance(pieces.join(' '));
      u.lang = SPEECH_LANG[lang]||'en-IN';
      u.onend = ()=>{ if(token===PLAYER.token) onState('idle'); };
      onState('playing');
      window.speechSynthesis.speak(u);
      return;
    }
  }
  if(token===PLAYER.token) onState('idle');
}

function SpeakButton({text, lang, auto}){
  const [state,setState] = useState('idle');
  const mine = useRef(-1);
  const start = ()=>{ speak(text, lang, s=>setState(s)); mine.current = PLAYER.token; };
  useEffect(()=>{ if(auto && text) start(); },[auto]);
  // Another answer started speaking: this button is no longer the active one.
  useEffect(()=>{ const t=setInterval(()=>{ if(state!=='idle' && mine.current!==PLAYER.token) setState('idle'); },400);
    return ()=>clearInterval(t); },[state]);
  const busy = state!=='idle';
  return (
    <button className="act" aria-pressed={busy} title="Read this answer aloud"
      onClick={()=>{ if(busy){ stopSpeaking(); setState('idle'); } else start(); }}>
      <Icon name={busy&&state==='playing'?'stop':'speaker'}/>
      {state==='loading'?'Preparing the voice…':state==='playing'?'Stop':'Listen'}
    </button>
  );
}

/* ---- make a video of this answer ----
   The server reuses this exact answer and its sources, so the video explains
   what the student just read. One video is made at a time; progress is
   polled every two seconds. A video takes a few minutes, so the stages are
   named and a clock runs: slow should read as working, never as stuck. */
const STAGES = ['Script','Pictures','Voice','Video'];
function stageOf(step){
  const s = String(step||'').toLowerCase();
  if(s.includes('together')||s==='done') return 3;
  if(s.includes('voice')) return 2;
  if(s.includes('paint')||s.includes('picture')) return 1;
  return 0;
}

function useVideoJob({d, ctx}){
  const [job,setJob] = useState(null);
  const [err,setErr] = useState('');
  const [t0,setT0] = useState(0);
  const [now,setNow] = useState(Date.now());
  const timer = useRef(null);
  useEffect(()=>{ if(!job || job.state==='done' || job.state==='error') return;
    const t=setInterval(()=>setNow(Date.now()),1000); return ()=>clearInterval(t); },[job]);
  useEffect(()=>()=>clearInterval(timer.current),[]);

  const poll = id => {
    clearInterval(timer.current);
    timer.current = setInterval(async ()=>{
      try{
        const j = await (await fetch('/api/video/'+id)).json();
        setJob(j);
        if(j.state==='done' || j.state==='error' || j.error==='unknown job') clearInterval(timer.current);
      }catch(e){ /* keep polling through a blip */ }
    },2000);
  };

  const start = async ()=>{
    setErr('');
    try{
      const r = await fetch('/api/video',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({question:ctx?.question, answer:d.answer, sources:d.sources,
          language:ctx?.lang||d.language, class_level:ctx?.cls, subject:ctx?.sub,
          retrieval_method:d.retrieval_method})});
      const j = await r.json();
      if(!r.ok){ setErr(j.error||('failed ('+r.status+')')); return; }
      setT0(Date.now()); setJob(j); poll(j.id);
    }catch(e){ setErr(String(e)); }
  };
  return {job, err, start, reset:()=>{setJob(null);setErr('');}, t0, now};
}

function VideoPanel({v}){
  const {job,err,start,reset,t0,now} = v;
  if(err && !job) return <p className="note error" style={{marginTop:14}}>{err}</p>;
  if(!job) return null;

  if(job.state==='error') return (
    <div className="making">
      <div className="top"><span>The video could not be made.</span>
        <button className="act" onClick={()=>{reset();start();}}>Try again</button></div>
      <p className="detail">{job.error}</p>
    </div>);

  if(job.state==='done'){
    const r = job.result||{};
    return (
      <figure className="film">
        <video src={job.url} controls autoPlay playsInline></video>
        <figcaption>
          <span><b>{r.title||'Concept video'}</b><br/>
            {r.seconds}s · {r.narrated?'narrated':'subtitles only'} · {r.illustrations||0} pictures ·{' '}
            <a href="/videos">video library</a>
            {job.note && <span className="note error" style={{display:'block',marginTop:6}}>{job.note}</span>}
          </span>
          {r.verified && <span className="stamp" title="Every line and arrow was checked against this answer">Fact-checked</span>}
        </figcaption>
      </figure>);
  }

  const secs = Math.max(0, Math.floor((now - t0)/1000));
  const clock = Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  const cur = job.state==='queued' ? -1 : stageOf(job.step);
  return (
    <div className="making" aria-live="polite">
      <div className="top">
        <span>{job.state==='queued'?'Waiting for the video maker…':'Making a 30-second video of this answer'}</span>
        <span className="clock">{clock} · usually 2–5 min</span>
      </div>
      <ol className="steps">
        {STAGES.map((s,i)=><li key={s} className={i<cur?'done':i===cur?'now':''}>{s}</li>)}
      </ol>
      {job.step && job.state!=='queued' && <p className="detail">{job.step} · {Math.round((job.progress||0)*100)}%</p>}
    </div>);
}

/* ---- sources, as footnotes ---- */
function Footnotes({list, cited, open, flash}){
  const [openSet,setOpenSet] = useState({});
  useEffect(()=>{ if(open) setOpenSet(o=>({...o,[open]:true})); },[open]);
  if(!list.length) return null;
  const order = [...list].sort((a,b)=> (cited.has(b.marker)?1:0) - (cited.has(a.marker)?1:0));
  return (
    <div className="footnotes">
      <div className="hd"><span>From {list.length} textbook page{list.length===1?'':'s'}</span>
        <span>select a source to read the passage</span></div>
      {order.map(s=>{
        const n = String(s.marker||'').replace('S','');
        return (
          <div id={'fn-'+s.marker} key={s.marker}
               className={'fnrow'+(cited.has(s.marker)?' cited':'')+(flash===s.marker?' flash':'')}>
            <span className="num">{n}</span>
            <div className="src">
              <button onClick={()=>setOpenSet(o=>({...o,[s.marker]:!o[s.marker]}))}>{sourceLabel(s)}</button>
              {openSet[s.marker] && s.excerpt &&
                <div className="ex" lang={langAttr(s.excerpt, s.language)}>{s.excerpt}</div>}
            </div>
          </div>);
      })}
    </div>);
}

function Answer({d, lang, autoSpeak, ctx}){
  const [openFn,setOpenFn] = useState(null);
  const [flash,setFlash] = useState(null);
  const video = useVideoJob({d, ctx});
  const srcs = d.sources||[];
  const text = String(d.answer||'');
  const parts = text.replace(/\s+(\[S\d+\])/g,'$1').split(/(\[S\d+\])/g);
  const cited = new Set((text.match(/\[S\d+\]/g)||[]).map(m=>m.slice(1,-1)));
  const provider = d.model_provider||'';
  const secs = d.total_ms!=null ? (d.total_ms/1000).toFixed(1)+' s' : null;

  const goto = marker => {
    setOpenFn(marker); setFlash(marker);
    setTimeout(()=>document.getElementById('fn-'+marker)?.scrollIntoView({behavior:'smooth',block:'center'}),30);
    setTimeout(()=>setFlash(null),1400);
  };

  if(d.streaming && !text) return (
    <div className="searching"><span className="line"></span>
      Looking through your Class {ctx?.cls} {subjectName(ctx?.sub)} book…</div>);

  return (
    <div className="answer">
      <div className="label">Ans.</div>
      <div className="prose" lang={langAttr(text, lang)}>
        {parts.map((p,i)=> /^\[S\d+\]$/.test(p)
          ? <sup key={i} className="fn" role="button" tabIndex={0} title={'Source '+p.slice(2,-1)}
                 onClick={()=>goto(p.slice(1,-1))}
                 onKeyDown={e=>{ if(e.key==='Enter') goto(p.slice(1,-1)); }}>{p.slice(2,-1)}</sup>
          : <span key={i}>{p}</span>)}
        {d.streaming && <span className="caret"></span>}
      </div>


      {!d.streaming && <>
        <div className="actions">
          {text && <SpeakButton text={text} lang={lang||d.language||'english'} auto={autoSpeak}/>}
          {d.grounded!==false && srcs.length>0 && text && !video.job &&
            <button className="act" onClick={video.start} title="Make a 30-second explainer video of this answer">
              <Icon name="film"/>Make video</button>}
        </div>
        <VideoPanel v={video}/>
        <Footnotes list={srcs} cited={cited} open={openFn} flash={flash}/>
        {(d.retrieval_method || secs) &&
          <details className="how">
            <summary>How this answer was found</summary>
            <dl>
              {d.rewritten_query && <><dt>Searched the book for</dt><dd lang={langAttr(d.rewritten_query, lang)}>{d.rewritten_query}</dd></>}
              {d.retrieval_method && <><dt>Search</dt><dd>{d.retrieval_method}</dd></>}
              {provider && <><dt>Written by</dt><dd>{provider}</dd></>}
              {d.groundedness!=null && <><dt>Overlap with sources</dt><dd>{d.groundedness}</dd></>}
              {d.retrieval_ms!=null && <><dt>Search time</dt><dd>{d.retrieval_ms} ms</dd></>}
              {d.first_token_ms!=null && <><dt>First words</dt><dd>{d.first_token_ms} ms</dd></>}
              {secs && <><dt>Total</dt><dd>{secs}</dd></>}
              {srcs.map(s=>s.score!=null && <React.Fragment key={s.marker}>
                <dt>Source {String(s.marker).replace('S','')} score</dt>
                <dd>{Number(s.score).toFixed(3)}{s.rerank_score!=null?' (reranked)':''}</dd></React.Fragment>)}
            </dl>
          </details>}
      </>}
    </div>
  );
}

function App(){
  const [msgs,setMsgs] = useState([]);
  const [q,setQ] = useState('');
  const [busy,setBusy] = useState(false);
  const [health,setHealth] = useState(null);
  const [lang,setLang] = useState('english');
  const [cls,setCls] = useState('7');
  const [sub,setSub] = useState('science');
  const [theme,setTheme] = useState(()=>{ try{ return localStorage.getItem('st_theme')||''; }catch(e){ return ''; } });
  const [autoRead,setAutoRead] = useState(()=>{ try{ return localStorage.getItem('st_autoread')==='1'; }catch(e){ return false; } });
  const scroller = useRef(null);
  const box = useRef(null);
  // The question box grows with what is typed, up to a third of the window.
  const fit = ()=>{ const t=box.current; if(!t) return; t.style.height='auto';
    t.style.height=Math.min(t.scrollHeight+2, Math.round(window.innerHeight*0.3))+'px'; };
  useEffect(fit,[q]);

  useEffect(()=>{ try{ localStorage.setItem('st_autoread', autoRead?'1':'0'); }catch(e){} },[autoRead]);
  useEffect(()=>{ if(theme) document.documentElement.setAttribute('data-theme',theme);
                  else document.documentElement.removeAttribute('data-theme');
                  try{ localStorage.setItem('st_theme',theme); }catch(e){} },[theme]);
  useEffect(()=>{fetch('/api/health').then(r=>r.json()).then(setHealth).catch(()=>setHealth({status:'offline'}))},[]);
  // Scroll only the reading pane: scrollIntoView also moved the whole page, top bar included.
  useEffect(()=>{ const el=scroller.current; if(el) el.scrollTo({top:el.scrollHeight,behavior:'smooth'}); },[msgs.length,busy]);
  useEffect(()=>{document.documentElement.lang = LANG[lang].code},[lang]);

  const dark = theme ? theme==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;

  // Stream over SSE so the first words land in under a second. Sources arrive
  // before any token, so footnotes render while the answer is still writing.
  const ask = async (text,o={})=>{
    const question=(text||q).trim(); if(!question||busy) return;
    const L=o.lang||lang, C=o.cls||cls, S=o.sub||sub;
    const history = msgs.slice(-4).map(m=>({
      role: m.role, content: m.role==='user' ? m.text : (m.data?.answer||'')
    })).filter(h=>h.content);

    setMsgs(m=>[...m,{role:'user',text:question,lang:L,cls:C,sub:S}]); setQ(''); setBusy(true);
    const idx = msgs.length + 1;
    stopSpeaking();
    setMsgs(m=>[...m,{role:'assistant',lang:L,cls:C,sub:S,question,autoSpeak:autoRead,
                      data:{answer:'',sources:[],streaming:true}}]);

    try{
      const r = await fetch('/api/chat/stream',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({question,language:L,class_level:C,subject:S,history})
      });
      if(!r.ok || !r.body) throw new Error('stream unavailable ('+r.status+')');

      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf='', acc='';
      while(true){
        const {done,value} = await reader.read();
        if(done) break;
        buf += dec.decode(value,{stream:true});
        const lines = buf.split('\n\n'); buf = lines.pop();
        for(const line of lines){
          if(!line.startsWith('data:')) continue;
          let ev; try{ ev = JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
          if(ev.type==='meta'){
            setMsgs(m=>{const c=[...m]; c[idx]={...c[idx],data:{...c[idx].data,...ev,streaming:true}}; return c;});
          } else if(ev.type==='token'){
            acc += ev.text;
            setMsgs(m=>{const c=[...m]; c[idx]={...c[idx],data:{...c[idx].data,answer:acc,streaming:true}}; return c;});
          } else if(ev.type==='done'){
            setMsgs(m=>{const c=[...m];
              c[idx]={...c[idx],data:{...c[idx].data,...ev,answer:ev.answer||acc,streaming:false}};
              return c;});
          } else if(ev.type==='error'){
            throw new Error(ev.message);
          }
        }
      }
    }catch(e){
      // Fall back to the non-streaming endpoint rather than losing the answer.
      try{
        const r2 = await fetch('/api/chat',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({question,language:L,class_level:C,subject:S,history})
        });
        const d = await r2.json();
        setMsgs(m=>{const c=[...m]; c[idx]={...c[idx],role:'assistant',data:{...d,streaming:false}}; return c;});
      }catch(e2){
        setMsgs(m=>{const c=[...m]; c[idx]={role:'assistant',error:String(e2)}; return c;});
      }
    }finally{ setBusy(false) }
  };

  const online = health?.status==='online';
  const pick = e => { setLang(e.lang); setCls(e.cls); setSub(e.sub); ask(e.q,{lang:e.lang,cls:e.cls,sub:e.sub}); };
  const brand = (
    <div className="brand"><Icon name="book" size={30}/>
      <div><b>StoryTutor</b><small>NCERT · Classes 6–8</small></div></div>);

  return (
    <div className="frame">
      <aside className="rail" aria-label="Choose your book">
        {brand}
        <div className="group"><h4>Language</h4>
          <div className="langs">
            {LANGS.map(l=><button key={l.id} aria-pressed={lang===l.id} onClick={()=>setLang(l.id)}
              lang={l.code}>{l.native}{l.id!=='english' && <small>{l.name}</small>}</button>)}
          </div></div>
        <div className="group"><h4>Class</h4>
          <div className="classes">
            {['6','7','8'].map(c=><button key={c} aria-pressed={cls===c} onClick={()=>setCls(c)}
              aria-label={'Class '+c}>{c}</button>)}
          </div></div>
        <div className="group"><h4>Subject</h4>
          <div className="subjects">
            {SUBJECTS.map(s=><button key={s.id} aria-pressed={sub===s.id} onClick={()=>setSub(s.id)}>{s.name}</button>)}
          </div></div>
        <div className="rail-foot">
          <a className="rail-link" href="/videos"><Icon name="library"/>Video library</a>
          <button className="toggle" aria-pressed={autoRead}
            onClick={()=>{ if(autoRead) stopSpeaking(); setAutoRead(!autoRead); }}>
            <span className="sw"></span>Read answers aloud</button>
          <button className="rail-link" onClick={()=>setTheme(dark?'light':'dark')}>
            <Icon name={dark?'sun':'moon'}/>{dark?'Paper':'Blackboard'}</button>
          <div className={'status'+(online?' on':'')}><i></i>{health==null?'Connecting…':online?'Tutor ready':'Tutor offline'}</div>
        </div>
      </aside>

      <main className="page">
        <div className="topbar">
          <div className="row">{brand}<span className="spacer"></span>
            <a className="rail-link" href="/videos" aria-label="Video library"><Icon name="library"/></a>
            <button className="rail-link" onClick={()=>setTheme(dark?'light':'dark')} aria-label="Switch theme">
              <Icon name={dark?'sun':'moon'}/></button></div>
          <div className="row pickers">
            <select value={lang} onChange={e=>setLang(e.target.value)} aria-label="Language">
              {LANGS.map(l=><option key={l.id} value={l.id}>{l.native}</option>)}</select>
            <select value={cls} onChange={e=>setCls(e.target.value)} aria-label="Class">
              {['6','7','8'].map(c=><option key={c} value={c}>Class {c}</option>)}</select>
            <select value={sub} onChange={e=>setSub(e.target.value)} aria-label="Subject">
              {SUBJECTS.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select>
          </div>
        </div>

        <div className="scroll" ref={scroller}>
          <div className="column">
            {!msgs.length && (
              <section className="intro">
                <h1>Ask your textbook.</h1>
                <p>Answers come only from the NCERT Class 6–8 Science and Social Science books, in English,
                  <span lang="hi"> हिंदी</span> or <span lang="mr">मराठी</span>, with the page each fact came from.</p>
                <div className="try">Try one</div>
                <ol>
                  {EXAMPLES.map((e,i)=>(
                    <li key={i}><button onClick={()=>pick(e)}>
                      <span className="n">{i+1}.</span>
                      <span><span className="q" lang={LANG[e.lang].code}>{e.q}</span>
                        <span className="where">Class {e.cls} · {subjectName(e.sub)} · {LANG[e.lang].native}</span></span>
                    </button></li>))}
                </ol>
              </section>
            )}

            {msgs.map((m,i)=> m.role==='user' ? (
              <article className="qa" key={i}>
                <div className="label">Q.</div>
                <h2 className="question" lang={langAttr(m.text, m.lang)} style={{fontWeight:400}}>{m.text}</h2>
                <div className="context">Class {m.cls} · {subjectName(m.sub)} · {LANG[m.lang]?.native}</div>
                {msgs[i+1] && (msgs[i+1].error
                  ? <p className="note error" style={{marginTop:16}}>Something went wrong: {msgs[i+1].error}</p>
                  : <Answer d={msgs[i+1].data} lang={msgs[i+1].lang} autoSpeak={msgs[i+1].autoSpeak} ctx={msgs[i+1]}/>)}
              </article>
            ) : null)}
          </div>
        </div>

        <div className="composer">
          <div className="inner">
            <div className="asking">Asking your <b>Class {cls} {subjectName(sub)}</b> book in <b>{LANG[lang].native}</b></div>
            <div className="field">
              <textarea ref={box} rows={1} value={q} onChange={e=>setQ(e.target.value)} lang={langAttr(q, lang)}
                placeholder={lang==='hindi'?'अपनी पाठ्यपुस्तक से कुछ भी पूछिए…':lang==='marathi'?'तुमच्या पाठ्यपुस्तकातून काहीही विचारा…':'Ask anything from your textbook…'}
                onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}}} aria-label="Your question"/>
              <button className="ask" onClick={()=>ask()} disabled={busy||!q.trim()}>Ask</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
